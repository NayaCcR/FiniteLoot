org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# Versioning. Every subproject ships under ONE version: <versionLine>.<patch>
# where patch = git commit count - versionCommitOffset, so commits alone bump
# the patch. versionCommitOffset is the commit count of the last release tag;
# when a maintenance move changes history length, recalibrate it so the next
# build keeps the released version number, then tag as usual.
# ---------------------------------------------------------------------------
versionLine=1.1
versionCommitOffset=2

# ---------------------------------------------------------------------------
# Paper side. Also the game version that goes into the released file name.
# ---------------------------------------------------------------------------
paperMinecraftVersion=26.2

# ---------------------------------------------------------------------------
# NeoForge side. The mod targets a different Minecraft line than the plugin on
# purpose: the plugin follows whatever Paper servers run, the mod serves
# modpack servers, which are a different server from a different download. The
# two artifacts are released together but never expected to match game versions.
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.235
loader_version_range=[1,)

mod_id=finiteloot
mod_name=FiniteLoot
mod_license=GPL-3.0-only
mod_group_id=vip.naya.finiteloot
mod_authors=Naya
mod_description=Per-player structure loot with a server-wide claim cap. Server-side only.

sqlite_version=3.51.1.0
junit_version=5.11.4
snakeyaml_version=2.3

# ---------------------------------------------------------------------------
# Build tuning.
#
# maven.neoforged.net is slow/flaky from some networks; retry instead of failing
# the whole build on one dropped socket. No absolute paths belong in this file.
# ---------------------------------------------------------------------------
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
