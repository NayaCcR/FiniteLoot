name: Build FiniteLoot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          git config core.filemode false
          chmod +x gradlew

      - name: Build, test, and check style
        run: ./gradlew clean build --stacktrace

      - name: Upload plugin and mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiniteLoot-${{ github.sha }}
          path: |
            paper/build/libs/finiteloot-*-paper.jar
            neoforge/build/libs/finiteloot-*-neoforge.jar
          if-no-files-found: error
          retention-days: 14
